name: exécutables

# Compile l'exécutable Rust de WEB_ANTENNA pour chaque système et les dépose dans la
# publication « binaires », en deux archives par système :
# - web_antenna-<système> : l'exécutable seul, que binaires.sh / binaires.cmd prennent sur un
#   clone git sans cargo ;
# - web_antenna-prod-<système> : la production, complète et sans git — l'exécutable, les scripts
#   de démarrage et ce que le serveur sert (pages, js, css, données). Ni sources, ni specs, ni bancs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl : exécutables statiques, indépendants de la glibc du poste (Raspberry Pi OS)
          - { os: ubuntu-latest, cible: x86_64-unknown-linux-musl, nom: linux-x86_64 }
          - { os: ubuntu-24.04-arm, cible: aarch64-unknown-linux-musl, nom: linux-aarch64 }
          - { os: macos-latest, cible: aarch64-apple-darwin, nom: macos-aarch64 }
          - { os: windows-latest, cible: x86_64-pc-windows-msvc, nom: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.cible }}

      - if: contains(matrix.cible, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # web_antenna seul : les outils d'essai des caisses (faux_openems...) ne se publient pas
      - run: cargo build --release --bin web_antenna --target ${{ matrix.cible }}

      - name: Archive (l'exécutable et le commit dont il vient)
        shell: bash
        run: |
          mkdir bin
          cd target/${{ matrix.cible }}/release
          if [ "${{ runner.os }}" = Windows ]; then
            cp ./web_antenna.exe ../../../bin/
          else
            cp ./web_antenna ../../../bin/
          fi
          cd ../../..
          git rev-parse HEAD > bin/commit
          if [ "${{ runner.os }}" = Windows ]; then
            (cd bin && 7z a ../web_antenna-${{ matrix.nom }}.zip .)
          else
            tar -czf web_antenna-${{ matrix.nom }}.tar.gz -C bin .
          fi

      - name: Archive de production (exécutable, scripts de démarrage, page)
        shell: bash
        run: |
          P=prod/web_antenna
          mkdir -p $P/test
          cp -r bin $P/
          cp demarrer_*.sh demarrer_*.cmd binaires.sh binaires.cmd README.md LICENSE $P/
          # ce que le serveur sert (STATIQUE de src/serveur.rs) : la page, css/ et js/
          cp index.html $P/
          cp -r css js $P/
          # la carte d'essai que le README propose d'ouvrir (pas les bancs de test/)
          cp test/patch-2450.xml $P/test/
          if [ "${{ runner.os }}" = Windows ]; then
            (cd prod && 7z a ../web_antenna-prod-${{ matrix.nom }}.zip web_antenna)
          else
            tar -czf web_antenna-prod-${{ matrix.nom }}.tar.gz -C prod web_antenna
          fi

      - name: Publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # les quatre compilations arrivent ensemble : une seule crée la publication
          gh release view binaires >/dev/null 2>&1 \
            || gh release create binaires --title "Exécutables" \
                 --notes "Exécutables de WEB_ANTENNA, recompilés à chaque envoi sur main. web_antenna-<système> : pris par binaires.sh et binaires.cmd. web_antenna-prod-<système> : la production complète (exécutable, scripts de démarrage, pages), à décompresser puis lancer par demarrer_WEB_ANTENNA." \
            || true
          # l'empreinte de chaque archive, que binaires.sh et binaires.cmd verifient apres telechargement
          for f in web_antenna-${{ matrix.nom }}.* web_antenna-prod-${{ matrix.nom }}.*; do
            (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") | cut -d" " -f1 > "$f.sha256"
          done
          gh release upload binaires web_antenna-${{ matrix.nom }}.* web_antenna-prod-${{ matrix.nom }}.* --clobber
