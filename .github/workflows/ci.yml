name: bancs d'essai

on:
  push:
  pull_request:

jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exécutable Rust (web_antenna) et outils des caisses
        run: cargo build --bins

      # Sans openEMS : le lancement, le suivi et le dépouillement sont éprouvés sur un faux
      # openEMS (solveur/src/bin/faux_openems.rs) et sur les références figées du Python
      # d'origine (modele/essais/, solveur/essais/ref/). Les bancs intégrés de l'appairage et du
      # pilote sont des tests Rust de la caisse commune (dépôt web_suite).
      #   modele/    : modèle, pièces, champs .vtr
      #   solveur/   : XML d'openEMS, lancement, dépouillement, HDF5
      #   src/       : projets, routes, mise à jour git
      #   tests/     : banc_serveur (fichiers servis, Host, chemins Windows, routes),
      #                banc_github_relai (Enregistrer + GitHub), carte_antenne (test/patch-2450.xml)
      - name: Tests Rust — modèle, solveur, projets, serveur (exécutable en boîte noire)
        run: cargo test

      - name: Découpage des polygones
        run: node test/banc-polygones.js

      - name: Logique de la page — ports, balayage, unités
        run: node test/banc-interface.js
