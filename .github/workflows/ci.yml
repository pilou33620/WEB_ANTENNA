name: bancs d'essai

on:
  push:
  pull_request:

jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sans openEMS : ses roues n'existent que pour Windows et Python 3.10 /
      # 3.11. Le banc saute alors la partie qui l'exige, et le dit ; tout le
      # reste (modèle, script généré, pertes, maillage, page) est éprouvé.
      - name: Dépendances du banc
        run: pip install --quiet numpy h5py

      - name: Banc principal (lance aussi banc-champs, banc-polygones, banc-interface)
        run: python python/test/banc-openems.py

      - name: Serveur — fichiers servis, Host, chemins Windows
        run: python python/test/banc-serveur.py

      - name: Enregistrer + GitHub (relai au lanceur WEB_SUITE) — banc d'essai
        run: python python/test/banc-github-relai.py
